[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-devsecops-template"
version = "0.1.0"
description = "A DevSecOps CI/CD template with a safe mock robot application."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Robot DevSecOps Team" }
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "PyYAML>=6.0",
  "pydantic>=2.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "black>=24.0",
  "bandit[toml]>=1.7.8",
  "pre-commit>=3.7",
  "httpx>=0.27"
]

[tool.setuptools.packages.find]
include = ["robot_mock*"]

[tool.setuptools.package-data]
robot_mock = ["configs/*"]

[tool.pytest.ini_options]
testpaths = ["robot_mock/tests"]
addopts = [
  "--cov=robot_mock",
  "--cov-report=term-missing",
  "--cov-fail-under=70"
]

[tool.coverage.run]
source = ["robot_mock"]
omit = ["robot_mock/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["robot_mock", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.bandit]
exclude_dirs = ["robot_mock/tests"]
skips = []