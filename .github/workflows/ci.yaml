name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Local/CI parity checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Coverage
        run: make coverage

      - name: Validate config
        run: make validate-config

      - name: Upload coverage HTML
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: warn

      - name: Upload CI diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: artifacts/ci/
          if-no-files-found: warn